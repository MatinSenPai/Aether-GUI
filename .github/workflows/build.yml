name: build

# Tauri can't cross-bundle from one OS to another, so each platform builds on
# its own runner. Manual dispatch uploads the bundles as run artifacts (for
# testing); pushing a v* tag additionally attaches them to a draft release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
            target: ""
            aether_asset: ""
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            aether_asset: ""
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            aether_asset: aether-macos-x86_64.tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: ""
            aether_asset: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Fetch Aether core (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          AETHER_ASSET: ${{ matrix.aether_asset }}
        run: bash src-tauri/binaries/fetch-aether.sh

      # The Windows asset is a zip rather than a tar.gz, so it has its own
      # script. Both read src-tauri/binaries/AETHER_VERSION, and CI calls the
      # same scripts a developer runs locally — an earlier version inlined the
      # Windows fetch here, which is how a local Windows build could ship with
      # no engine while CI looked green.
      - name: Fetch Aether core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./src-tauri/binaries/fetch-aether.ps1

      # A bundle with no engine in it still builds, installs and launches — it
      # just can't ever connect, and the only way to find out is to run it.
      # Fail here instead, where the reason is obvious.
      - name: Verify the core is present before bundling
        shell: bash
        run: |
          bin=src-tauri/binaries/aether
          [ "$RUNNER_OS" = "Windows" ] && bin=src-tauri/binaries/aether.exe
          if [ ! -f "$bin" ]; then
            echo "::error::$bin is missing — the fetch step did not produce a core, so this bundle would ship with no tunnel engine."
            exit 1
          fi
          ls -l "$bin"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseDraft: true
          args: ${{ matrix.target != '' && format('--target {0}', matrix.target) || '' }}

      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.name }}
          path: |
            src-tauri/target/**/bundle/**/*.dmg
            src-tauri/target/**/bundle/**/*.AppImage
            src-tauri/target/**/bundle/**/*.deb
            src-tauri/target/**/bundle/**/*.rpm
            src-tauri/target/**/bundle/**/*setup.exe
            src-tauri/target/**/bundle/**/*.msi
